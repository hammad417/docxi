name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      DOCXI_WITH_RAILS: ${{ matrix.rails && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ruby 2.5",                 ruby: "2.5", gemfile: Gemfile }
          - { name: "Ruby 2.6",                 ruby: "2.6", gemfile: Gemfile }
          - { name: "Ruby 4.0",                 ruby: "4.0", gemfile: Gemfile }
          - { name: "rubyzip 1.3 (Ruby 2.5)",   ruby: "2.5", gemfile: gemfiles/rubyzip_1.3.gemfile }
          - { name: "rubyzip 2.4 (Ruby 3.3)",   ruby: "3.3", gemfile: gemfiles/rubyzip_2.4.gemfile }
          - { name: "nokogiri 1.11 (Ruby 2.5)", ruby: "2.5", gemfile: gemfiles/nokogiri_1.11.gemfile }
          - { name: "Rails 5.2 (Ruby 2.5)",     ruby: "2.5", gemfile: gemfiles/rails_5.2.gemfile, rails: true }
          - { name: "Rails 6.0 (Ruby 2.7)",     ruby: "2.7", gemfile: gemfiles/rails_6.0.gemfile, rails: true }
          - { name: "Rails 6.1 (Ruby 3.0)",     ruby: "3.0", gemfile: gemfiles/rails_6.1.gemfile, rails: true }
          - { name: "Rails 7.0 (Ruby 3.1)",     ruby: "3.1", gemfile: gemfiles/rails_7.0.gemfile, rails: true }
          - { name: "Rails 7.1 (Ruby 3.2)",     ruby: "3.2", gemfile: gemfiles/rails_7.1.gemfile, rails: true }
          - { name: "Rails 7.2 (Ruby 3.3)",     ruby: "3.3", gemfile: gemfiles/rails_7.2.gemfile, rails: true }
          - { name: "Rails 8.0 (Ruby 3.4)",     ruby: "3.4", gemfile: gemfiles/rails_8.0.gemfile, rails: true }
          - { name: "Rails 8.1 (Ruby 4.0)",     ruby: "4.0", gemfile: gemfiles/rails_8.1.gemfile, rails: true }
          - { name: "Rails main (Ruby 4.0)",    ruby: "4.0", gemfile: gemfiles/rails_main.gemfile, rails: true, experimental: true }
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  libreoffice:
    name: Opens in LibreOffice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: bundle exec rake samples
      - name: Convert every sample to PDF
        run: |
          for docx in tmp/samples/*.docx; do
            soffice --headless --convert-to pdf --outdir tmp/pdf "$docx"
            pdf="tmp/pdf/$(basename "$docx" .docx).pdf"
            test -s "$pdf" || { echo "LibreOffice could not open $docx"; exit 1; }
          done
