# Publishes to RubyGems.org with trusted publishing (no API key stored) when a
# version tag is pushed. Add this workflow as a trusted publisher on the gem's
# RubyGems.org page first.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true
      - uses: rubygems/release-gem@v1
